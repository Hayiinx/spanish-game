<!DOCTYPE html>
<html lang="es">
<head>
    <charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Revisión - Entrevista a Sofia</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            background-color: #16213e;
            border: 2px solid #0f3460;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }
        h1 {
            color: #e94560;
            text-align: center;
            font-size: 1.5rem;
            margin-top: 0;
        }
        .dialogue-box {
            background-color: #0f3460;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            min-height: 80px;
        }
        .speaker {
            font-weight: bold;
            color: #e94560;
            margin-bottom: 5px;
        }
        .text {
            font-size: 1.1rem;
            line-height: 1.4;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 2px solid #533483;
            background-color: #1a1a2e;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #e94560;
        }
        button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #cf3550;
        }
        .feedback {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
            min-height: 25px;
        }
        .success { color: #4ecc6d; }
        .error { color: #ff6b6b; }
        .progress {
            text-align: center;
            font-size: 0.9rem;
            color: #a0a0a0;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>📝 Entrevistas Deportivas (Entraînement de Sofia)</h1>
    <div class="progress" id="progressText">Étape 1 sur 12</div>
    
    <div class="dialogue-box">
        <div class="speaker" id="speakerName">Mia :</div>
        <div class="text" id="questionText">Chargement...</div>
    </div>

    <div id="inputArea">
        <label for="userAnswer" style="font-size: 0.9rem; color: #ccc; display: block; margin-bottom: 5px;">Écris ta réplique (Sofia) en espagnol :</label>
        <input type="text" id="userAnswer" placeholder="Tape ta réponse ici..." autocomplete="off">
        <button onclick="checkAnswer()">Valider la réplique</button>
    </div>

    <div class="feedback" id="feedbackMessage"></div>
</div>

<script>
    // Liste des questions/réponses de l'interview
    const steps = [
        {
            speaker: "Mia & Zoé",
            prompt: "Mia : ¡Hola a todos! Bienvenidos a nuestra entrevista... / Zoé : ¡Hola! Gracias por invitarnos.",
            expected: "¡Hola! Estoy muy contenta de estar aquí."
        },
        {
            speaker: "Mia",
            prompt: "Mia : Para empezar, ¿podéis presentaros? / Zoé : Me llamo Zoé, tengo 18 años y juego al fútbol desde hace diez años.",
            expected: "Me llamo Sofia, tengo 19 años y practico atletismo desde hace ocho años."
        },
        {
            speaker: "Mia",
            prompt: "Mia : ¿Cuántas veces entrenáis por semana? / Zoé : Entreno cuatro veces por semana...",
            expected: "Entreno cinco veces por semana. A veces entreno por la mañana y por la tarde."
        },
        {
            speaker: "Mia",
            prompt: "Mia : ¡Es mucho trabajo! ¿Tenéis tiempo para estudiar y descansar? / Zoé : Sí, pero a veces es difícil...",
            expected: "Estoy de acuerdo. Hay que organizarse bien y dormir suficiente."
        },
        {
            speaker: "Mia",
            prompt: "Mia : ¿Cuál es la mayor dificultad en vuestro deporte? / Zoé : Para mí, la mayor dificultad es perder un partido...",
            expected: "Para mí, es el cansancio y la presión de las competiciones. Siempre quiero mejorar mis resultados."
        },
        {
            speaker: "Mia",
            prompt: "Mia : ¿Alguna vez habéis querido abandonar? / Zoé : Sí, algunas veces, especialmente después de una derrota...",
            expected: "Sí, pero recuerdo por qué empecé. El deporte es mi pasión y no quiero rendirme."
        },
        {
            speaker: "Mia",
            prompt: "Mia : ¿Cómo reaccionáis cuando perdéis? / Zoé : Estoy triste, pero intento aprender de mis errores.",
            expected: "Yo también. Pienso en lo que puedo mejorar para la próxima competición."
        },
        {
            speaker: "Mia",
            prompt: "Mia : ¿Cuál es vuestro mejor recuerdo deportivo? / Zoé : Mi mejor recuerdo es ganar un torneo...",
            expected: "Mi mejor recuerdo es participar en mi primera competición importante. Estaba muy nerviosa, pero muy feliz."
        },
        {
            speaker: "Mia",
            prompt: "Mia : ¿Cuáles son vuestros sueños para el futuro? / Zoé : Mi sueño es convertirme en futbolista profesional...",
            expected: "Mi sueño es participar en los Juegos Olímpicos y representar a mi país."
        },
        {
            speaker: "Mia",
            prompt: "Mia : ¡Son sueños fantásticos! ¿Qué consejo daríais a los jóvenes...?",
            expected: "Hay que disfrutar, tener confianza y no compararse con los demás."
        },
        {
            speaker: "Mia",
            prompt: "Mia : [...] ¿Queréis añadir algo para terminar? / Zoé : Sí, quiero decir que el fútbol me ha enseñado...",
            expected: "Y yo quiero decir que el deporte nos ayuda a tener confianza y a superar nuestros límites."
        },
        {
            speaker: "Mia",
            prompt: "Mia : Muchas gracias a las dos. ¡Hasta pronto y buena suerte!",
            expected: "¡Muchas gracias! ¡Hasta pronto!"
        }
    ];

    let currentStep = 0;

    function loadStep() {
        if (currentStep < steps.length) {
            document.getElementById("speakerName").innerText = "Contexte de l'entretien :";
            document.getElementById("questionText").innerText = steps[currentStep].prompt;
            document.getElementById("progressText").innerText = `Étape ${currentStep + 1} sur ${steps.length}`;
            document.getElementById("userAnswer").value = "";
            document.getElementById("feedbackMessage").innerText = "";
        } else {
            document.querySelector(".game-container").innerHTML = `
                <h1>🎉 ¡Felicidades Sofia!</h1>
                <p style="text-align: center; font-size: 1.2rem; line-height: 1.6;">
                    Tu as terminé toute l'interview avec succès ! Tu es prête pour ta révision ! 🚀
                </p>
            `;
        }
    }

    // Normalisation simple pour ignorer les petites variations de majuscules/points
    function cleanStr(str) {
        return str.trim().toLowerCase().replace(/[¡!¿?,.]/g, "");
    }

    function checkAnswer() {
        const userText = document.getElementById("userAnswer").value;
        const expectedText = steps[currentStep].expected;
        const feedback = document.getElementById("feedbackMessage");

        if (cleanStr(userText) === cleanStr(expectedText)) {
            feedback.className = "feedback success";
            feedback.innerText = "¡Muy bien! C'est exact. 🎉";
            currentStep++;
            setTimeout(loadStep, 1500); // Passe à l'étape suivante après 1.5s
        } else {
            feedback.className = "feedback error";
            feedback.innerText = `Presque ! La bonne réponse était : "${expectedText}"`;
            // Optionnel : on peut donner la main pour réessayer ou forcer le passage. Ici on laisse une chance de voir la correction.
            setTimeout(() => {
                currentStep++;
                loadStep();
            }, 4000);
        }
    }

    // Permettre de valider avec la touche "Entrée"
    document.getElementById("userAnswer").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            checkAnswer();
        }
    });

    // Lancer le jeu au chargement
    loadStep();
</script>

</body>
</html>
